name: matchflix
description: A Tinder-for-Movies app where users swipe to match movies

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0

  # UI Components
  flutter_card_swiper: ^7.0.0
  cached_network_image: ^3.3.1
  google_fonts: ^8.0.2
  confetti: ^0.8.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
